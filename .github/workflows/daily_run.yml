name: Daily Stock Index Fetcher

on:
  schedule:
    # 美股收盘后执行（UTC 21:30 ≈ 美东 16:30 冬令 / 17:30 夏令）
    - cron: '30 21 * * *'
  workflow_dispatch:   # 允许手动触发测试

permissions:
  contents: write      # 允许 bot 推送 commit

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 使用默认 token 即可

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script (抓取 + 发送 Discord + 生成 index.html)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit and Push Data + HTML
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # 拉取最新代码避免冲突
          git pull --rebase || true

          # 加入需要保存的文件
          git add data/history.csv index.html || true

          # 有变更才 commit（假日或无新数据时不报错）
          git commit -m "📈 Auto-update daily stock history & index.html ($(date -u +%Y-%m-%d))" || exit 0

          git push
